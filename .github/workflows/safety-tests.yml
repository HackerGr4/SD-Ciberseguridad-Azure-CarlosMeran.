name: Simulated safety tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - if: runner.os != 'Windows'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Windows normalizes trailing dots in path components. This repository's
      # name ends in a dot, so checkout's default GITHUB_WORKSPACE is invalid.
      # Fetch the exact public CI commit into a safe temporary path, without tokens.
      - name: Prepare Windows source directory
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $sourcePath = Join-Path $env:RUNNER_TEMP 'scanner-source'
          git init $sourcePath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $sourcePath remote add origin "https://github.com/$env:SOURCE_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $sourcePath fetch --depth=1 --no-tags origin $env:SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $sourcePath checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
        working-directory: ${{ runner.os == 'Windows' && format('{0}/scanner-source', runner.temp) || github.workspace }}
      - run: python -m compileall -q .
        working-directory: ${{ runner.os == 'Windows' && format('{0}/scanner-source', runner.temp) || github.workspace }}
      - run: python -m unittest discover -v
        working-directory: ${{ runner.os == 'Windows' && format('{0}/scanner-source', runner.temp) || github.workspace }}
      - run: python demo.py --output-dir demo-output
        working-directory: ${{ runner.os == 'Windows' && format('{0}/scanner-source', runner.temp) || github.workspace }}
